<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" role="img" aria-labelledby="title desc"><title id="title">Research atlas</title><desc id="desc">Four connected research interests: aerial AI, spatial computing, remote sensing, and AI engineering.</desc><rect x="1" y="1" width="1198" height="510" rx="20" fill="#101d2d" stroke="#2c4052"/><text x="32" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#71e8c4" letter-spacing="2">RESEARCH ATLAS</text><text x="32" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="32" fill="#edf4fa" font-weight="600">Different perspectives. One connected field.</text><rect x="32" y="122" width="548" height="151" rx="12" fill="#132536" stroke="#2c4052"/><circle cx="56" cy="149" r="4" fill="#71e8c4"/><text x="72" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#71e8c4" letter-spacing="2">PERCEPTION</text><text x="52" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Aerial AI</text><text x="52" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a6bacb" >Route-aware detection &amp; UAV inspection</text><rect x="620" y="122" width="548" height="151" rx="12" fill="#132536" stroke="#2c4052"/><circle cx="644" cy="149" r="4" fill="#9dbdea"/><text x="660" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#9dbdea" letter-spacing="2">GEOMETRY</text><text x="640" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Spatial computing</text><text x="640" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a6bacb" >Visual geometry &amp; scene reconstruction</text><rect x="32" y="303" width="548" height="151" rx="12" fill="#132536" stroke="#2c4052"/><circle cx="56" cy="330" r="4" fill="#e6b975"/><text x="72" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#e6b975" letter-spacing="2">CONTEXT</text><text x="52" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Remote sensing</text><text x="52" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a6bacb" >Geospatial perception &amp; photogrammetry</text><rect x="620" y="303" width="548" height="151" rx="12" fill="#132536" stroke="#2c4052"/><circle cx="644" cy="330" r="4" fill="#c8b6db"/><text x="660" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#c8b6db" letter-spacing="2">SYSTEMS</text><text x="640" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">AI engineering</text><text x="640" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a6bacb" >Serving, streaming &amp; mission orchestration</text></svg>