<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Recent remote sensing experiments from imagery to grounded 3D scenes</title>
  <desc id="desc">A dark mission-control style research summary showing multi-resolution RGB imagery flowing through ABot-Earth 3D scene generation, Gaussian analysis, horizontal registration, and DEM fusion, with the main findings about spatial layout, small targets, and uncertain height geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142b"/>
      <stop offset="0.55" stop-color="#0b1f36"/>
      <stop offset="1" stop-color="#16133a"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#07142b" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#07142b" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#07142b" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M32 142 H1168 M32 332 H1168" stroke="#2a435e" stroke-width="1" opacity="0.65"/>
  <circle cx="1120" cy="56" r="86" fill="#22d3ee" opacity="0.05"/>
  <circle cx="1100" cy="82" r="44" fill="#a78bfa" opacity="0.07"/>

  <text x="56" y="52" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RECENT WORK / REMOTE SENSING → 3D</text>
  <text x="56" y="91" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Read → generate → align → explain</text>
  <text x="56" y="119" fill="#9bb4c8" font-family="Arial, Helvetica, sans-serif" font-size="15">A small study on what single-view satellite imagery can preserve — and what it must invent.</text>
  <text x="1120" y="52" text-anchor="end" fill="#8aa4b8" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">FIELD NOTE // CURRENT</text>

  <g transform="translate(56 166)">
    <rect width="238" height="136" rx="16" fill="url(#cyanCard)" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="20" y="28" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">01 / INPUT</text>
    <text x="20" y="62" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">MULTI-SCALE</text>
    <text x="20" y="87" fill="#d2e8f2" font-family="Arial, Helvetica, sans-serif" font-size="14">RGB satellite ROIs</text>
    <text x="20" y="111" fill="#8aa4b8" font-family="Arial, Helvetica, sans-serif" font-size="12">water–agriculture · port logistics</text>
  </g>

  <path d="M314 234 H340" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)" filter="url(#softGlow)"/>

  <g transform="translate(350 166)">
    <rect width="238" height="136" rx="16" fill="url(#violetCard)" stroke="#a78bfa" stroke-opacity="0.62"/>
    <text x="20" y="28" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">02 / GENERATE</text>
    <text x="20" y="62" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ABot-Earth</text>
    <text x="20" y="87" fill="#d2e8f2" font-family="Arial, Helvetica, sans-serif" font-size="14">3DGS scene synthesis</text>
    <text x="20" y="111" fill="#8aa4b8" font-family="Arial, Helvetica, sans-serif" font-size="12">semantic layout + visual prior</text>
  </g>

  <path d="M608 234 H634" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" filter="url(#softGlow)"/>

  <g transform="translate(644 166)">
    <rect width="238" height="136" rx="16" fill="#102c3a" stroke="#22d3ee" stroke-opacity="0.65"/>
    <text x="20" y="28" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">03 / MEASURE</text>
    <text x="20" y="62" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">GAUSSIAN FIELD</text>
    <text x="20" y="87" fill="#d2e8f2" font-family="Arial, Helvetica, sans-serif" font-size="14">point and appearance structure</text>
    <text x="20" y="111" fill="#8aa4b8" font-family="Arial, Helvetica, sans-serif" font-size="12">XY coverage · Z · scale · alpha</text>
  </g>

  <path d="M902 234 H928" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" filter="url(#softGlow)"/>

  <g transform="translate(938 166)">
    <rect width="206" height="136" rx="16" fill="url(#greenCard)" stroke="#4ade80" stroke-opacity="0.62"/>
    <text x="20" y="28" fill="#86efac" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">04 / GROUND</text>
    <text x="20" y="62" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ALIGN + TERRAIN</text>
    <text x="20" y="87" fill="#d2e8f2" font-family="Arial, Helvetica, sans-serif" font-size="14">spatial alignment + ground context</text>
    <text x="20" y="111" fill="#8aa4b8" font-family="Arial, Helvetica, sans-serif" font-size="12">terrain anchor, not DSM</text>
  </g>

  <g transform="translate(56 360)">
    <rect width="254" height="112" rx="15" fill="#0a2135" stroke="#2a5872"/>
    <text x="18" y="28" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">2D SPATIAL LAYOUT</text>
    <text x="18" y="63" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">strongly preserved</text>
    <text x="18" y="88" fill="#9bb4c8" font-family="Arial, Helvetica, sans-serif" font-size="12">roads · shorelines · yards · fields</text>
  </g>

  <g transform="translate(330 360)">
    <rect width="254" height="112" rx="15" fill="#171933" stroke="#4c3a85"/>
    <text x="18" y="28" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SMALL TARGETS</text>
    <text x="18" y="63" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">richer at finer scale</text>
    <text x="18" y="88" fill="#9bb4c8" font-family="Arial, Helvetica, sans-serif" font-size="12">vehicles · containers · vessels</text>
  </g>

  <g transform="translate(604 360)">
    <rect width="254" height="112" rx="15" fill="#241d2f" stroke="#7c4b78"/>
    <text x="18" y="28" fill="#f0abfc" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">Z GEOMETRY</text>
    <text x="18" y="63" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">prior-driven</text>
    <text x="18" y="88" fill="#9bb4c8" font-family="Arial, Helvetica, sans-serif" font-size="12">oblique views expose artifacts</text>
  </g>

  <g transform="translate(878 360)">
    <rect width="266" height="112" rx="15" fill="#182a25" stroke="#3f7657"/>
    <text x="18" y="28" fill="#86efac" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">WHAT DEM ADDS</text>
    <text x="18" y="63" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">terrain context</text>
    <text x="18" y="88" fill="#9bb4c8" font-family="Arial, Helvetica, sans-serif" font-size="12">helpful ground, not measured height</text>
  </g>
</svg>
