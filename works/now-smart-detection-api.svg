<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Smart Detection API data flow</title>
  <desc id="desc">Data-flow diagram showing mission inputs entering Flask orchestration, YOLOv5 inference and spatial gating, four-frame confirmation, and MJPEG, snapshot, and event delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1c"/>
      <stop offset="0.58" stop-color="#0b1d34"/>
      <stop offset="1" stop-color="#211044"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#34d399"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="18" fill="url(#bg)" stroke="#1e4770"/>
  <g stroke="#5eeaff" stroke-opacity=".07">
    <path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200"/>
    <path d="M80 0V680M240 0V680M400 0V680M560 0V680M720 0V680M880 0V680M1040 0V680"/>
  </g>

  <g font-family="monospace">
    <text x="38" y="46" fill="#22d3ee" font-size="17" letter-spacing="3">NOW // SMART DETECTION API</text>
    <text x="38" y="72" fill="#94a3b8" font-size="12">DATA FLOW · LOCAL RUNTIME · UAV INSPECTION</text>
    <text x="1060" y="47" fill="#22c55e" font-size="13">● ACTIVE</text>

    <g fill="#081426" stroke="#24537a" stroke-width="1" stroke-dasharray="7 7">
      <rect x="24" y="94" width="205" height="470" rx="14"/>
      <rect x="248" y="94" width="205" height="470" rx="14"/>
      <rect x="472" y="94" width="205" height="470" rx="14"/>
      <rect x="696" y="94" width="205" height="470" rx="14"/>
      <rect x="920" y="94" width="256" height="470" rx="14"/>
    </g>
    <g fill="#64748b" font-size="12" letter-spacing="1">
      <text x="44" y="122">01 / INPUTS</text>
      <text x="268" y="122">02 / ORCHESTRATION</text>
      <text x="492" y="122">03 / VISION + SPATIAL</text>
      <text x="716" y="122">04 / RELIABILITY</text>
      <text x="940" y="122">05 / DELIVERY</text>
    </g>

    <g stroke-width="2">
      <g fill="#0b2942" stroke="#22d3ee">
        <rect x="45" y="151" width="163" height="72" rx="10"/>
        <rect x="45" y="260" width="163" height="72" rx="10"/>
      </g>
      <g fill="#302314" stroke="#f59e0b">
        <rect x="45" y="369" width="163" height="72" rx="10"/>
      </g>
      <g fill="#102e2f" stroke="#34d399">
        <rect x="269" y="260" width="163" height="72" rx="10"/>
        <rect x="493" y="151" width="163" height="72" rx="10"/>
        <rect x="493" y="369" width="163" height="72" rx="10"/>
        <rect x="717" y="260" width="163" height="72" rx="10"/>
      </g>
      <g fill="#221c47" stroke="#a78bfa">
        <rect x="941" y="151" width="214" height="72" rx="10"/>
        <rect x="941" y="260" width="214" height="72" rx="10"/>
      </g>
      <g fill="#172235" stroke="#94a3b8">
        <rect x="941" y="369" width="214" height="72" rx="10"/>
      </g>
    </g>

    <g fill="#e6f7ff" font-size="15" font-weight="700">
      <text x="71" y="180">VIDEO SOURCES</text>
      <text x="71" y="289">MISSION REQUEST</text>
      <text x="71" y="398">DJI TELEMETRY</text>
      <text x="292" y="289">FLASK ORCHESTRATOR</text>
      <text x="515" y="180">YOLOv5 MODELS</text>
      <text x="515" y="398">SPATIAL GATE</text>
      <text x="739" y="289">EVENT CONFIRMATION</text>
      <text x="967" y="180">MJPEG FEEDBACK</text>
      <text x="967" y="289">SNAPSHOT STORE</text>
      <text x="967" y="398">EVENT DELIVERY</text>
    </g>
    <g fill="#94a3b8" font-size="11">
      <text x="71" y="202">RTSP · HTTP · LOCAL FILE</text>
      <text x="71" y="311">POST /detect</text>
      <text x="71" y="420">MQTT CACHE · GPS · ALT</text>
      <text x="292" y="311">TASK LIFECYCLE</text>
      <text x="515" y="202">POLICY ROUTING</text>
      <text x="515" y="420">GPS + POLYGON ROI</text>
      <text x="739" y="311">4 CONSECUTIVE FRAMES</text>
      <text x="967" y="202">GET /video_feed</text>
      <text x="967" y="311">LATEST CONFIRMED IMAGE</text>
      <text x="967" y="420">OPTIONAL ASYNC PUSH</text>
    </g>

    <g fill="none" stroke-width="2.5" marker-end="url(#arrowCyan)" filter="url(#glow)">
      <path d="M208 187H238V296H269" stroke="#22d3ee"/>
      <path d="M208 296H269" stroke="#22d3ee"/>
      <path d="M208 405H238V430H472V405H493" stroke="#f59e0b"/>
    </g>
    <g fill="none" stroke-width="2.5" marker-end="url(#arrowGreen)" filter="url(#glow)">
      <path d="M432 278H463V187H493" stroke="#34d399"/>
      <path d="M574 223V369" stroke="#34d399"/>
      <path d="M432 314V345H463V405H493" stroke="#34d399"/>
      <path d="M656 405H686V296H717" stroke="#34d399"/>
    </g>
    <g fill="none" stroke-width="2.5" marker-end="url(#arrowSlate)">
      <path d="M880 278H909V187H941" stroke="#94a3b8"/>
      <path d="M880 296H941" stroke="#94a3b8"/>
    </g>
    <g fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowViolet)">
      <path d="M880 314V345H909V405H941"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <g fill="#0b1528" stroke="#1e293b">
      <rect x="230" y="230" width="95" height="24" rx="6"/>
      <rect x="214" y="337" width="105" height="24" rx="6"/>
      <rect x="432" y="235" width="110" height="24" rx="6"/>
      <rect x="601" y="334" width="94" height="24" rx="6"/>
      <rect x="687" y="335" width="104" height="24" rx="6"/>
      <rect x="886" y="230" width="104" height="24" rx="6"/>
      <rect x="885" y="337" width="112" height="24" rx="6"/>
    </g>
    <g fill="#a5f3fc" font-size="10">
      <text x="241" y="246">VIDEO FRAMES</text>
      <text x="225" y="353">TASK + POLICY</text>
      <text x="445" y="251">ACTIVE FRAMES</text>
      <text x="611" y="350">RAW DETECTIONS</text>
      <text x="697" y="351">ROI-VALID TARGETS</text>
      <text x="896" y="246">ANNOTATED FRAMES</text>
      <text x="894" y="353" fill="#c4b5fd">CONFIRMED EVENT</text>
    </g>

    <path d="M38 592H1162" stroke="url(#line)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 1124;360 764;0 1124" dur="4s" repeatCount="indefinite"/>
    </path>
    <g fill="#94a3b8" font-size="12">
      <text x="40" y="622">CREATE → DETECT → FILTER → CONFIRM → DELIVER → STOP / RELOAD</text>
      <text x="40" y="648">Bounded reconnect · exponential backoff · clean failure state</text>
    </g>
    <g font-size="11">
      <circle cx="900" cy="618" r="5" fill="#22d3ee"/>
      <text x="912" y="622" fill="#94a3b8">primary flow</text>
      <circle cx="1000" cy="618" r="5" fill="#a78bfa"/>
      <text x="1012" y="622" fill="#94a3b8">async output</text>
    </g>
  </g>
</svg>
