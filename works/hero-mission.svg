<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Aerial Mission Control</title>
  <desc id="desc">Animated mission control header for Wentian Shen's computer vision portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07142b"/><stop offset=".52" stop-color="#123c63"/><stop offset="1" stop-color="#24104f"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#5eeaff" stroke-opacity=".14"><path d="M0 54h1200M0 108h1200M0 162h1200M0 216h1200M80 0v300M240 0v300M400 0v300M560 0v300M720 0v300M880 0v300M1040 0v300"/></g>
  <g transform="translate(1010 150)" fill="none" stroke="#22d3ee" stroke-opacity=".65"><circle r="82"/><circle r="54"/><circle r="25"/><path d="M-100 0h200M0-100v200"/><path d="M0 0L70-42" stroke="#22d3ee" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></path></g>
  <g font-family="monospace" fill="#dffaff"><text x="72" y="70" font-size="15" fill="#22d3ee" letter-spacing="4">SYSTEM ONLINE // MISSION CONTROL</text><text x="70" y="133" font-size="42" font-weight="700">WENTIAN SHEN</text><text x="73" y="170" font-size="19" fill="#a5f3fc">AERIAL VISION SYSTEMS</text><text x="73" y="221" font-size="14" fill="#94a3b8">COMPUTER VISION  ·  UAV INSPECTION  ·  SPATIAL AI</text><text x="73" y="258" font-size="12" fill="#22c55e">● ACTIVE</text><text x="190" y="258" font-size="12" fill="#94a3b8">MISSION ID: WAWJSWT-01</text></g>
  <path d="M20 286h1160" stroke="url(#line)" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 1200;420 780;0 1200" dur="4s" repeatCount="indefinite"/></path>
</svg>
