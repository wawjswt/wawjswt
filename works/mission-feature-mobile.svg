<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="title desc"><title id="title">Mission flow</title><desc id="desc">Collect video and telemetry, understand spatial rules, confirm detections and deliver results.</desc><rect x="1" y="1" width="598" height="558" rx="20" fill="#101d2d" stroke="#2c4052"/><text x="28" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#71e8c4" >CURRENT BUILD / UAV INSPECTION</text><text x="28" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="32" fill="#edf4fa" font-weight="600">From signal to evidence.</text><rect x="28" y="127" width="262" height="177" rx="12" fill="#132a38" stroke="#2e4e58"/><text x="46" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Collect</text><text x="46" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >Video streams</text><text x="46" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >MQTT telemetry</text><rect x="310" y="127" width="262" height="177" rx="12" fill="#132a38" stroke="#2e4e58"/><text x="328" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Understand</text><text x="328" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >YOLO inference</text><text x="328" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >GPS / ROI rules</text><rect x="28" y="331" width="262" height="177" rx="12" fill="#132a38" stroke="#2e4e58"/><text x="46" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Confirm</text><text x="46" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >Consecutive</text><text x="46" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >detection frames</text><rect x="310" y="331" width="262" height="177" rx="12" fill="#132a38" stroke="#2e4e58"/><text x="328" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edf4fa" font-weight="600">Deliver</text><text x="328" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >MJPEG stream</text><text x="328" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#a6bacb" >Snapshots / events</text></svg>